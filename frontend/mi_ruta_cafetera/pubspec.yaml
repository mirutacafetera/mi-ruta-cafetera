
name: mi_ruta_cafetera

description: "Aplicación turística Mi Ruta Cafetera."

# The following line prevents the package from accidentally being published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number of your application.
# A version number is three numbers separated by dots, like 1.2.43
# Both the version and the builder number may be overridden by flutter
# build and --build-number, respectively.
# Read more about versioning at
# https://dart.dev/tools/pub/pubspec

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your project needs to work.
# To automatically upgrade the package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies may be manually added to pub.dev.

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  http: ^1.6.0
  image_picker: ^1.2.4
  http_parser: ^4.1.2
  shared_preferences: ^2.5.6
  geolocator: ^14.0.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  device_info_plus: ^13.3.0
  file_picker: ^13.1.0
  just_audio: ^0.10.6
  font_awesome_flutter: ^11.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The following adds the package:flutter_lints package to your project.
  # The lint rules are activated in the analysis_options.yaml file located
  # at the root of your package.
  # See that file for information about deactivating lints.

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# The following section is specific to Flutter packages.

flutter:

  # The following line ensures that the Material Icons font
  # is included in your application.
  # Use with the CupertinoIcons class for iOS style icons.
  uses-material-design: true

  # Assets de la aplicación
  assets:
    - assets/img/mi_ruta_cafetera.png
    - assets/img/iconoia.png
    - assets/img/logo-completo.png
    - assets/img/fondo-i-sesion.png
    - assets/img/fondo_admin.png
    - assets/images/bienvenida/
    - assets/images/sitios/
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/Poppins-OFL.txt
    - assets/fonts/Nunito-OFL.txt

  # Tipografías. Lora, Poppins y Nunito (SIL Open Font License 1.1, ver
  # assets/fonts/*-OFL.txt) se incluyen como archivos locales para que funcionen sin conexión,
  # tanto en Android como en Web. La fuente predeterminada (Roboto)
  # sigue siendo la del sistema.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-BoldItalic.ttf
          weight: 700
          style: italic

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic

    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito-BoldItalic.ttf
          weight: 700
          style: italic

# Configuración para generar el ícono de la aplicación
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/mi_ruta_cafetera.png"
  min_sdk_android: 21
  adaptive_icon_background: "#22130C"
  adaptive_icon_foreground: "assets/img/mi_ruta_cafetera.png"
